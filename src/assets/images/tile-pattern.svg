      <circle cx="75" cy="75" r="20" fill="#B89A5B" opacity="0.6"/>
      <path d="M75 10 L140 75 L75 140 L10 75 Z" fill="none" stroke="#7D1638" stroke-width="2" opacity="0.4"/>
    </pattern>
    <linearGradient id="tileFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C211D" stop-opacity="0"/>
