<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <linearGradient id="hallD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2f4b"/>
      <stop offset="45%" stop-color="#7D1638"/>
      <stop offset="100%" stop-color="#2C211D"/>
    </linearGradient>
    <linearGradient id="colD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#B89A5B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#hallD)"/>
  <!-- perspective floor -->
  <polygon points="0,1500 1200,1500 780,900 420,900" fill="#2C211D" opacity="0.35"/>
  <!-- columns -->
  <g>
    <rect x="60" y="300" width="70" height="900" fill="url(#colD)" opacity="0.85"/>
    <rect x="270" y="450" width="55" height="750" fill="url(#colD)" opacity="0.7"/>
    <rect x="875" y="450" width="55" height="750" fill="url(#colD)" opacity="0.7"/>
    <rect x="1070" y="300" width="70" height="900" fill="url(#colD)" opacity="0.85"/>
  </g>
  <!-- arches connecting -->
  <path d="M60 300 Q 165 200 270 300" fill="none" stroke="#B89A5B" stroke-width="10" opacity="0.7"/>
  <path d="M875 300 Q 975 200 1070 300" fill="none" stroke="#B89A5B" stroke-width="10" opacity="0.7"/>
  <path d="M270 300 Q 600 150 875 300" fill="none" stroke="#F5F1E8" stroke-width="6" opacity="0.4"/>
  <!-- glow -->
  <ellipse cx="600" cy="500" rx="420" ry="260" fill="#F5F1E8" opacity="0.12"/>
</svg>
